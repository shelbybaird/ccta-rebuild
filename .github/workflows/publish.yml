# Builds the site and publishes it to GitHub Pages.
#
# Three things start a build:
#   - a change pushed to main, so editing content publishes the site;
#   - a timer, so content that is only supposed to show between two dates
#     appears and disappears without anybody pushing anything;
#   - a button, for when somebody wants a build now.
#
# Nothing here is built from a third party's moving target. Hugo is fetched at a
# fixed version and checked against the checksum its authors published, and each
# action is pinned to the exact commit it was reviewed at rather than to a tag,
# because a tag can be moved to point at different code.

name: Publish

on:
  push:
    branches: [main]
  schedule:
    # TEMPORARY, FOR MEASUREMENT. Every ten minutes.
    #
    # This is not the intended setting. It is here to measure how often a
    # scheduled run is actually delivered, because so far almost none have
    # been. Of the seventeen hourly windows that elapsed on 27 August 2026,
    # one produced a run, and that one arrived nine minutes late. Ten-minute
    # spacing turns a measurement that takes a day into one that takes an
    # hour.
    #
    # The interval is itself the experiment. If delivery gets worse at ten
    # minutes, that points at runs being discarded once they are delayed past
    # their next occurrence, which would punish short intervals specifically.
    # If it stays near six percent, the loss is indifferent to spacing. If it
    # improves, something was particular to the previous slot.
    #
    # RESTORE "37 * * * *" WHEN THE MEASUREMENT IS DONE, for the reasons that
    # chose it: "show from" on an announcement carries an hour and a minute,
    # so a notice can be set for two in the afternoon, and an hourly rebuild
    # is the coarsest one that can honor that. Thirty-seven minutes past
    # avoids the hour and the quarter hours, where scheduled runs are most
    # often delayed. Hourly also removes the daylight-saving pair an
    # absolute-time schedule would need to stay near Ohio midnight in both
    # halves of the year.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Nothing is granted by default; each job asks for only what it needs.
permissions: {}

# One publish at a time, and never cancel one that is already running: a
# cancelled deployment can leave the live site mid-swap.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.165.0"
  HUGO_SHA256: "f43494894cdf4a8630a201d5c828051c77f523cc66bb3938b30806835470ac20"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0          # Hugo reads git history for page dates.

      - name: Work out the address this build will be served from
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install Hugo, and refuse to continue if it is not the file expected
        run: |
          set -euo pipefail
          file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSL --fail --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${file}" \
            -o "$file"
          echo "${HUGO_SHA256}  ${file}" | sha256sum --check --strict
          tar -xzf "$file" hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: Decide whether this build may be indexed by search engines
        id: indexable
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          # Only the Association's own domain is offered to search engines. Any
          # other address — a github.io preview above all — is a work in
          # progress and is published with a noindex tag and a robots.txt that
          # asks crawlers to stay out. The test is on the host alone, so the day
          # the domain is pointed at this site indexing begins by itself.
          host="$(printf '%s' "$BASE_URL" | sed -E 's#^https?://##; s#[:/].*$##')"
          if [ "$host" = "cctownship.org" ] || [ "$host" = "www.cctownship.org" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Serving from ${BASE_URL} (host ${host})"

      - name: Build the site
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}
          HUGO_PARAMS_INDEXABLE: ${{ steps.indexable.outputs.value }}
          TZ: America/New_York
        run: hugo --minify --gc --destination public

      - name: Fail if a preview build would have been indexable
        env:
          INDEXABLE: ${{ steps.indexable.outputs.value }}
        run: |
          set -euo pipefail
          # The check that proves the check works. On a preview build every page
          # must carry the noindex tag and robots.txt must disallow everything;
          # if either is missing the build stops rather than publishing a site
          # that search engines are free to take.
          #
          # The pattern tolerates an unquoted attribute value because --minify
          # rewrites name="robots" as name=robots. Matching only the quoted form
          # failed a correct build once already.
          if [ "$INDEXABLE" = "true" ]; then
            echo "Public build: indexing is intended, nothing to assert."
            exit 0
          fi
          total=0
          missing=0
          while IFS= read -r page; do
            total=$((total + 1))
            if ! grep -Eq '<meta[^>]+name="?robots"?[^>]*noindex' "$page"; then
              echo "::error file=${page}::page carries no noindex tag"
              missing=$((missing + 1))
            fi
          done < <(find public -type f -name '*.html')
          # A check that examined nothing would otherwise pass, which is the way
          # this kind of guard usually fails.
          if [ "$total" -eq 0 ]; then
            echo "::error::no pages were built, so nothing was checked" >&2
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::${missing} of ${total} pages carry no noindex tag" >&2
            exit 1
          fi
          if ! grep -q '^Disallow: /$' public/robots.txt; then
            echo "::error::preview build's robots.txt does not disallow crawling" >&2
            exit 1
          fi
          echo "Preview build: all ${total} pages carry noindex, robots.txt disallows crawling."

      - name: Package the site for publishing
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
