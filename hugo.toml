# Base address is supplied by the environment (HUGO_BASEURL) so that the same
# source builds for a subdirectory preview and for a root domain. Nothing in
# this repository hand-writes an internal path.
baseURL = "https://cctownship.org/"

title            = "Clermont County Township Association"
locale           = "en-us"
defaultContentLanguage = "en"

# LOAD-BEARING. Without this, dates typed by an officer are read as UTC, which
# runs four hours ahead of Ohio in summer and five in winter — so a notice set
# to stop showing at the end of a day disappears during the afternoon before.
timeZone = "America/New_York"

enableRobotsTXT = true

[pagination]
  pagerSize = 500          # The archive is ~87 entries fully backfilled. No pagination, ever.

[taxonomies]               # None. Nothing in the content model is tagged.

[markup.goldmark.renderer]
  unsafe = false           # Presentation must not leak into content. No raw HTML in a post body.

# The calendar publishes twice from one set of content: as a page a reader
# looks at, and as a feed a calendar application subscribes to. Declaring the
# media type as well as the format is what makes Hugo serve the feed as a
# calendar rather than as a file to download.
[mediaTypes."text/calendar"]
  suffixes = ["ics"]

[outputFormats.calendar]
  mediaType    = "text/calendar"
  baseName     = "calendar"     # published at /calendar/calendar.ics
  isPlainText  = true           # no HTML escaping: an ampersand in a venue name must survive
  notAlternative = false        # so the page can advertise the feed in its own head

[params]
  # Fall-backs for the four calendar settings an officer edits from the editing
  # screens, which are stored in `data/calendar.yml`. That file carries values
  # and nothing else: the editor rewrites it whole on every save, so a comment
  # written there would be deleted the first time somebody changed the meeting
  # time. The reasoning therefore lives here, where nothing but a person writes.
  #
  # Each template reads the data file and falls back to the value below, so a
  # setting deleted by mistake leaves the page correct rather than blank.
  meetingDay      = "third Thursday"
  meetingTime     = "6:30 pm"
  contactEmail    = "info@cctownship.org"   # role address; the free mail account is retired

  # One person has held both the Secretary and Treasurer offices for as long as
  # the present roster goes back, and the roster shows that as a single entry
  # naming both offices. Nothing is combined in the content: each term of office
  # is still its own entry, so the day the two offices go to two people the
  # cards separate by themselves. Set this to false to show every office
  # separately even when one person holds several.
  combineSharedOffices = true

# Hugo's default is to fall back to `date` when no publishDate is given, which
# would make a meeting scheduled for next month invisible until it happened, and
# would conflate "Posted" with "Show from" on an announcement. The content model
# treats those as independent fields, so only an explicit publishDate counts.
[frontmatter]
  publishDate = ["publishDate"]
  expiryDate  = ["expiryDate"]
