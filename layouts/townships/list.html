{{ define "main" }}
<h1>{{ .Title }}</h1>
<p class="lede">The fourteen townships of Clermont County. Each link goes to that township's own website.</p>
<ul class="grid grid--twp">
  {{ range .Pages.ByWeight }}
  <li class="card">
    <div class="card__media"><img src="{{ partial "asset.html" .Params.image }}" alt="" loading="lazy"></div>
    <div class="card__body">
      <h3><a href="{{ .Params.url_ }}" rel="noopener">{{ .Title }}</a></h3>
      <p>{{ replaceRE "^https?://(www\\.)?" "" (strings.TrimSuffix "/" .Params.url_) }}</p>
    </div>
  </li>
  {{ end }}
</ul>
{{ end }}
