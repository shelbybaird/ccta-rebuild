# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.205.4/schema/sveltia-cms.json

# Editing configuration for the Clermont County Township Association website.
#
# Every field below corresponds to a field in the content model, and the labels
# are what an officer reads. Where a label departs from the field name stored in
# the file, the label is the plain-English question and the name is what Hugo
# expects.
#
# Two things are deliberately absent and are recorded here so their absence is
# not mistaken for an oversight:
#   - No telephone number and no street address on the officer roster. A public
#     repository publishes its history, so a detail entered once cannot later be
#     withdrawn. Settled 23 August 2026.
#   - No editing box for the constitution. It is a document that is posted, not
#     a page that is edited: Article XI allows amendment only by a vote of the
#     membership.

backend:
  name: github
  repo: shelbybaird/ccta-rebuild
  branch: main
  # Where sign-in is brokered. GitHub will not exchange an authorization code
  # for a token without a client secret, and a secret cannot live in a page, so
  # the exchange happens in a small worker of ours rather than at Sveltia's
  # default of api.netlify.com. Source and reasoning: worker/README.md.
  base_url: https://sveltia-cms-auth.cctownship.workers.dev
  # Ask GitHub for the narrowest access that can still edit this site. The
  # broker's own default is `repo`, which would reach every private repository
  # an officer owns; this repository is public, so `public_repo` is enough and
  # signing in here grants nothing beyond it.
  auth_scope: public_repo

# An entry saved here publishes. There is deliberately no review queue in
# between, because the execution plan reserves a second approval for changes to
# how the site is built and not for ordinary content, and because a review step
# that only one person can perform is a step that person performs on their own
# work. Every save remains a commit, so nothing is lost and anything can be put
# back. Turning a queue on later is one line: `publish_mode: editorial_workflow`.

# Uploads land in one place. Documents already on the server keep their existing
# paths so that links to them continue to resolve; only new uploads come here.
media_folder: /static/uploads
public_folder: /uploads

# The repository keeps every version of every file permanently, and deleting a
# photograph later does not reclaim its space. Uploads are therefore capped at
# the point of upload rather than by asking anybody to remember.
media_libraries:
  # The asset browser otherwise offers four galleries of somebody else's
  # photographs, and choosing one stores its web address rather than a copy.
  # The picture is then fetched from that service by every reader who opens the
  # page, which tells that service who is reading the Association's notices —
  # the same disclosure the calendar embed was removed to stop. It also leaves
  # the page depending on a picture the Association does not hold, and a
  # description that stops being true if the picture changes.
  #
  # An address can still be typed by hand: the editor offers no setting that
  # removes that. Only a check at build time can refuse one.
  stock_assets: false
  all:
    max_file_size: 1048576      # one megabyte
    slugify_filename: true      # a filename with spaces makes a fragile address
    transformations:
      raster_image:
        format: webp            # the only conversion target the editor supports
        quality: 85
        width: 1600             # a maximum, not a target: smaller is left alone
        height: 1600
      svg:
        optimize: true

# The cap above is applied AFTER the image conversion, proved on 23 August 2026:
# a 4,252,401-byte photograph straight off a telephone was accepted and stored
# as 339,568 bytes at 1600×1200. For a photograph the number is therefore a
# backstop that never binds.
#
# A DOCUMENT IS NOT CONVERTED, so the same number would bind at full size. The
# three scanned sets of minutes already on the server run to 473 KB where a
# typed one averages 76 KB, and roughly fifty more meetings remain to be
# scanned. The file fields below therefore carry their own limit: generous
# enough that no scan of a set of minutes is ever refused, and still a backstop
# against something uploaded by mistake.

# The editor's preview pane would render these entries with its own generic
# markup rather than the website's, which would show an officer something that
# is not what the page looks like. The site itself is the preview.
editor:
  preview: false

# Without this, an optional field left alone is written as an empty string
# rather than left out, and Hugo reads an empty string as a value that is
# present. That is what removed an officer from the roster on 23 August 2026:
# `termEnd: ''` is not the same as no term end.
output:
  omit_empty_optional_fields: true

collections:
  # ─── Announcements ──────────────────────────────────────────────────────────
  - name: news
    label: News & Announcements
    label_singular: Announcement
    icon: campaign
    folder: /content/news
    extension: md
    format: yaml-frontmatter
    yaml_quote: true
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title]
    fields:
      - label: Headline
        name: title
        widget: string
        required: true

      - label: Posted
        name: date
        widget: datetime
        type: date
        format: 'YYYY-MM-DD'
        default: '{{now}}'
        required: true
        hint: The date shown to a reader, and the order of the list.

      - label: Show from
        name: publishDate
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss'
        input_timezone: America/New_York
        required: false
        hint: >-
          Leave empty to publish straight away. Filled in, the announcement does
          not exist on the site until that moment.

      - label: Stop showing after
        name: expiryDate
        widget: datetime
        type: date
        format: 'YYYY-MM-DD[T23:59:59]'
        input_timezone: America/New_York
        required: false
        hint: >-
          Leave empty for a notice that stays up until somebody removes it. The
          announcement remains visible throughout the chosen day and is gone the
          following morning.

      - label: Take this down
        name: draft
        widget: boolean
        default: false
        required: false
        hint: >-
          Removes the announcement from the site at the next build, whatever the
          dates say. This is how a notice with no expiry date is withdrawn.

      - label: Summary
        name: summary
        widget: text
        required: false
        hint: >-
          One or two sentences. Shown on the announcements list and on the home
          page, and used when the address is shared.

      # The image and its description are grouped rather than sitting side by
      # side, because that is the shape Sveltia documents for carrying alt text
      # and the shape its own image field is expected to grow into. Adopting it
      # now costs nothing: no announcement carries a photograph yet.
      # See sveltia/sveltia-cms discussion #802 and issue #936.
      # The object stays optional so an announcement without a photograph saves
      # normally, but its subfields are required, so once a photograph is added
      # it cannot be saved without a description.
      - label: Photograph
        name: image
        widget: object
        required: false
        collapsed: false
        fields:
          - label: File
            name: src
            widget: image
            required: true
            media_folder: /static/uploads
            public_folder: /uploads
          - label: Describe the photograph
            name: alt
            widget: string
            required: true
            hint: >-
              What somebody would need told if they could not see it. This is
              read aloud in place of the picture. An announcement with no
              photograph does not need this; a photograph does.

      - label: Files
        name: attachments
        label_singular: File
        widget: list
        required: false
        summary: '{{fields.title}}'
        hint: >-
          Documents hosted on this site. A link to another organization's page
          belongs in the announcement itself, below.
        fields:
          - { label: Title, name: title, widget: string, required: true }
          - label: Document
            name: file
            widget: file
            required: true
            media_folder: /static/uploads
            public_folder: /uploads
            media_libraries:
              all:
                max_file_size: 10485760   # documents are not converted

      - label: Announcement
        name: body
        widget: markdown
        required: true

  # ─── Meetings ───────────────────────────────────────────────────────────────
  - name: meetings
    label: Meetings
    label_singular: Meeting
    icon: event
    folder: /content/meetings
    extension: md
    format: yaml-frontmatter
    yaml_quote: true
    create: true
    identifier_field: location
    slug: "{{fields.date | date('YYYY-MM-DD')}}"
    summary: "{{fields.date | date('D MMMM YYYY')}} — {{fields.location}}"
    sortable_fields: [date]
    fields:
      - label: Date and time
        name: date
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss'
        input_timezone: America/New_York
        required: true

      - label: Location
        name: location
        widget: string
        required: true

      - label: Address
        name: address
        widget: string
        required: false
        hint: >-
          Not shown on the schedule page. It supplies the location to anyone who
          subscribes to the meeting calendar.

      - label: Status
        name: status
        widget: select
        default: scheduled
        required: true
        options:
          - { label: Scheduled, value: scheduled }
          - { label: Cancelled, value: cancelled }
          - { label: Moved, value: moved }
        hint: >-
          A cancelled meeting stays listed and is marked as cancelled. It is not
          removed.

      - label: Note
        name: note
        widget: string
        required: false
        hint: For example, joint meeting with the county, or moved from the 17th.

  # ─── Special events ─────────────────────────────────────────────────────────
  # A second dated type, beside Meetings rather than inside it.
  #
  # A meeting is defined by the constitution: the third Thursday, a status of
  # scheduled, cancelled or moved, and minutes attached to it afterwards. A
  # fundraising dinner or a holiday party is none of those things — it has a
  # name of its own, an end time, a description, and no minutes will ever be
  # attached to it. Adding a flag to Meetings would have meant a type where
  # half the fields are meaningless for half the entries, and a schedule page
  # that had to explain which rows were meetings.
  #
  # What the two share is only the part a calendar needs — when, where, and
  # whether it is still happening — and they share it by both feeding the
  # calendar and its subscribable feed, which is where they meet.
  - name: events
    label: Special Events
    label_singular: Special event
    icon: celebration
    folder: /content/events
    extension: md
    format: yaml-frontmatter
    yaml_quote: true
    create: true
    identifier_field: title
    slug: '{{slug}}'
    summary: "{{fields.date | date('D MMMM YYYY')}} — {{fields.title}}"
    sortable_fields: [date, title]
    fields:
      - label: Name of the event
        name: title
        widget: string
        required: true
        hint: What it is called on the calendar. For example, Annual fundraising dinner.

      - label: Date and time it starts
        name: date
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss'
        input_timezone: America/New_York
        required: true

      - label: Date and time it ends
        name: end
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss'
        input_timezone: America/New_York
        required: false
        hint: >-
          Optional. Left empty, the calendar shows the event as lasting the
          default length set on the Calendar settings screen.

      - label: Location
        name: location
        widget: string
        required: true
        hint: The name of the place. For example, Union Township Civic Center.

      - label: Address
        name: address
        widget: string
        required: false
        hint: >-
          The street address. Shown on the calendar beneath the name of the
          place, and given to anyone who subscribes to the calendar.

      - label: Status
        name: status
        widget: select
        default: scheduled
        required: true
        options:
          - { label: Scheduled, value: scheduled }
          - { label: Cancelled, value: cancelled }
          - { label: Moved, value: moved }
        hint: >-
          A cancelled event stays on the calendar and is marked as cancelled,
          so that somebody who has already put it in their diary is told.

      - label: Note
        name: note
        widget: string
        required: false
        hint: A short qualification. For example, tickets required, or members only.

      - label: Details
        name: body
        widget: markdown
        required: false
        hint: >-
          What the event is, who it is for, and anything somebody needs to know
          before coming. Shown on the event's own page and in the calendar
          subscription.

  # ─── Minutes ────────────────────────────────────────────────────────────────
  - name: minutes
    label: Minutes
    label_singular: Minutes entry
    icon: history_edu
    folder: /content/minutes
    extension: md
    format: yaml-frontmatter
    yaml_quote: true
    create: true
    identifier_field: date
    slug: "{{fields.date | date('YYYY-MM-DD')}}"
    summary: "Minutes of {{fields.date | date('D MMMM YYYY')}}"
    sortable_fields: [date]
    # There is no title field. The archive labels each entry from its date, and
    # a typed title would be a second statement of the same fact.
    fields:
      - label: Meeting date
        name: date
        widget: datetime
        type: date
        format: 'YYYY-MM-DD'
        required: true
        hint: Places the entry under the right year and supplies its label.

      - label: Document
        name: document
        widget: file
        required: true
        media_folder: /static/PDF/minutes
        public_folder: /PDF/minutes
        media_libraries:
          all:
            max_file_size: 10485760   # ten megabytes; documents are not converted

      - label: Note
        name: note
        widget: string
        required: false
        hint: For example, special meeting, amended, or approved as corrected.

  # ─── Officers ───────────────────────────────────────────────────────────────
  - name: officers
    label: Officers
    label_singular: Officer
    icon: badge
    folder: /content/officers
    extension: md
    format: yaml-frontmatter
    yaml_quote: true
    create: true
    identifier_field: name
    slug: '{{fields.office}}-{{fields.name}}'
    summary: '{{fields.office}} — {{fields.name}}'
    # No ordering here, deliberately. The roster is shown in the order Article V
    # names the offices, worked out from the office itself, so there is no
    # position to set and none to get wrong.
    # One entry per TERM OF OFFICE, not one per person. A roster that overwrites
    # itself has no history in it, which is what issue #2 asked to retain.
    fields:
      - label: Office
        name: office
        widget: select
        required: true
        options:
          - President
          - Vice-President
          - Secretary
          - Treasurer
          - Executive Committee-person
        hint: >-
          The five offices named in Article V. One person may hold two of them,
          which is recorded as two entries.

      - label: Name
        name: name
        widget: string
        required: true

      - label: Township
        name: township
        widget: select
        required: false
        options:
          - Batavia Township
          - Franklin Township
          - Goshen Township
          - Jackson Township
          - Miami Township
          - Monroe Township
          - Ohio Township
          - Pierce Township
          - Stonelick Township
          - Tate Township
          - Union Township
          - Washington Township
          - Wayne Township
          - Williamsburg Township
        hint: >-
          How a member reaches this officer. The roster publishes no personal
          telephone number, so the township's own published number is the route.

      - label: Term began
        name: termStart
        widget: datetime
        type: date
        format: 'YYYY-MM-DD'
        required: true
        hint: >-
          The date the officer took office. Article V sets elections on the
          third Thursday in November, and the whole slate takes office together.
          This is what makes the roster a dated record rather than a page that
          overwrites itself.

      - label: Term ended
        name: termEnd
        widget: datetime
        type: date
        format: 'YYYY-MM-DD'
        required: false
        hint: Empty means the officer is currently serving.

      - label: Email
        name: email
        widget: string
        required: false
        hint: >-
          An address belonging to the office rather than the person, so that it
          survives a change of officer.

      - label: Note
        name: note
        widget: string
        required: false

  # ─── Member townships ───────────────────────────────────────────────────────
  - name: townships
    label: Member townships
    label_singular: Township
    icon: location_city
    folder: /content/townships
    extension: md
    format: yaml-frontmatter
    yaml_quote: true
    # The county has fourteen townships and cannot gain a fifteenth, so the list
    # is maintained rather than added to. A township leaving the Association is
    # an event to handle deliberately, not a button to press by accident.
    create: false
    delete: false
    identifier_field: title
    summary: '{{title}}'
    # Alphabetical unless deliberately changed. Use the Reorder button above
    # the list; Hugo reads the resulting number from `weight`, which is why the
    # key is named rather than left at its default.
    reorder:
      key: weight
    fields:
      - label: Township
        name: title
        widget: string
        required: true

      - label: Website
        name: url_
        widget: string
        required: true
        pattern: ['^https://', 'The address must begin with https://']
        hint: >-
          Checked when each entry was migrated. The field is named url_ because
          Hugo reserves the plain name for a page's own address.

      # What the Association asks a member for is written here rather than kept
      # in somebody's head, because the person who replaces a tile years from
      # now will read this field and nothing else. The standard is set by the
      # page, not by taste: fourteen of these sit in a grid, and the grid only
      # reads as a grid while they are all the same shape and all filled.
      - label: Tile image
        name: image
        widget: image
        required: true
        media_folder: /static/images/townships
        public_folder: /images/townships
        hint: >-
          This picture is the whole tile, so it has to carry the township's name
          itself — nothing is printed underneath it. Supply it at 370 by 240
          pixels, or anything larger in those same proportions, and let the
          artwork fill the frame corner to corner. A logo on its own is usually
          the wrong shape: it leaves wide margins, and one tile with margins
          beside another without them is what stops a row of them looking like a
          row. Set the name in large enough type to read at postcard size.

      - label: Backing color behind the picture
        name: tileBackground
        widget: color
        required: false
        allowInput: true
        hint: >-
          Leave this empty almost always. It exists for a picture that does not
          fill its frame, or one drawn in white for a dark background, so that
          what sits behind it is chosen rather than left to chance. It changes
          only this one township's tile.


  # ─── The constitution ───────────────────────────────────────────────────────
  - name: constitution
    label: Constitution
    label_singular: Adopted version
    icon: gavel
    folder: /content/constitution
    extension: md
    format: yaml-frontmatter
    yaml_quote: true
    create: true
    identifier_field: title
    slug: "{{fields.adopted | date('YYYY-MM-DD')}}"
    summary: '{{title}}'
    sortable_fields: [adopted]
    # One entry per ADOPTED VERSION, which is what gives the page an amendment
    # record rather than a file that silently overwrites itself. There is no
    # body text field: anything typed into one would sit beside the adopted
    # document looking equally official while carrying none of its authority.
    fields:
      - label: Title
        name: title
        widget: string
        required: true
        hint: For example, Constitution and Bylaws, as amended 2021.

      - label: Adopted
        name: adopted
        widget: datetime
        type: date
        format: 'YYYY-MM-DD'
        required: true
        hint: >-
          The date of the vote that made this version authoritative. The most
          recent one is shown as the current constitution.

      - label: Document
        name: document
        widget: file
        required: true
        media_folder: /static/PDF/constitution
        public_folder: /PDF/constitution
        media_libraries:
          all:
            max_file_size: 10485760   # ten megabytes; documents are not converted

      - label: What changed
        name: note
        widget: string
        required: false
        hint: A line describing the amendment, so the history reads as a record.

# The alert banner is one file, so there is exactly one banner. It appears in
# the sidebar on its own and opens straight into its form.
  # ─── Temporary pages ────────────────────────────────────────────────────────
  # A page of its own for one subject, which appears and disappears on a date.
  #
  # Why this is not an announcement. An announcement can hold the same words,
  # the same picture and the same files — it was tried with a fundraising dinner
  # on 5 September 2026. The flyer filled the first screen, so a reader met a
  # poster and scrolled past all of it before reading anything, and the calls to
  # action, being links inside a paragraph, read as sentence links rather than
  # as the things a reader was being asked to do.
  #
  # So the two types differ in what they ARE, not in what they can hold. An
  # announcement is a notice in a dated list, read in passing. This is a page
  # somebody is sent to, and it is laid out to be acted on.
  #
  # Both are still wanted for a big event: the announcement says it is
  # happening, and links here; this page answers every question about it.
  - name: temporary
    label: Temporary Pages
    label_singular: Temporary page
    icon: flag
    folder: /content/temporary
    extension: md
    format: yaml-frontmatter
    yaml_quote: true
    create: true
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title]
    fields:
      - label: Page title
        name: title
        widget: string
        required: true

      - label: Short name for the menu
        name: menuLabel
        widget: string
        required: false
        maxlength: 16
        hint: >-
          Used only if the page is put in the menu below. One or two words —
          a full title makes the menu wrap to another row on a telephone.

      - label: Put this page in the menu while it is showing
        name: menuWhileLive
        widget: boolean
        default: false
        required: false
        hint: >-
          Adds it to the end of the menu, marked in red so it does not look
          like one of the Association's standing pages. It removes itself when
          the page stops showing; there is nothing to undo afterwards.

      - label: Date
        name: date
        widget: datetime
        type: date
        format: 'YYYY-MM-DD'
        default: '{{now}}'
        required: true
        hint: The day the page was written. It orders the list; it publishes nothing.

      - label: Show from
        name: publishDate
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss'
        input_timezone: America/New_York
        required: false
        hint: Leave empty to show it as soon as it is saved.

      - label: Stop showing after
        name: expiryDate
        widget: datetime
        type: date
        format: 'YYYY-MM-DD[T23:59:59]'
        input_timezone: America/New_York
        required: false
        hint: >-
          What makes the page temporary. After this day it is gone from the
          site and from the menu, and nobody has to remember to remove it. The
          file stays, so the same page can be brought back next year by
          changing two dates.

      - label: Take this down
        name: draft
        widget: boolean
        default: false
        required: false
        hint: Removes the page at the next build, whatever its dates say.

      - label: Opening paragraph
        name: summary
        widget: text
        required: true
        hint: >-
          Two or three sentences at the top of the page, beside the picture.
          What it is, when, where, and who it is for.

      - label: Flyer or photograph
        name: image
        widget: object
        required: false
        fields:
          - label: File
            name: src
            widget: image
            required: false
            media_folder: /static/uploads
            public_folder: /uploads
            media_libraries:
              all:
                max_file_size: 1048576
          - label: Describe the picture
            name: alt
            widget: string
            required: false
            hint: >-
              ⚠ A flyer carries the whole notice as a picture, which a screen
              reader cannot read. Write out what it says — the date, the time,
              the place and the price — or that reader gets nothing at all.

      - label: Calls to action
        name: callsToAction
        label_singular: Action
        widget: list
        required: false
        summary: '{{fields.label}}'
        hint: >-
          The buttons at the top of the page and again at the foot. Two is
          usually right; a page asking for five things is asking for none.
        fields:
          - { label: Button text, name: label, widget: string, required: true }
          - label: Where it goes
            name: link
            widget: string
            required: true
            hint: >-
              A file on this site (/uploads/form.pdf), another page here
              (/meetings/), an email address (mailto:treasurer@cctownship.org),
              or an address elsewhere beginning https://.
          - label: How prominent
            name: emphasis
            widget: select
            default: primary
            required: true
            options:
              - { label: Filled — the main thing being asked, value: primary }
              - { label: Outlined — an alternative, value: secondary }

      - label: Files
        name: attachments
        label_singular: File
        widget: list
        required: false
        summary: '{{fields.title}}'
        hint: Documents hosted on this site, listed at the foot of the page.
        fields:
          - { label: Title, name: title, widget: string, required: true }
          - label: Document
            name: file
            widget: file
            required: true
            media_folder: /static/uploads
            public_folder: /uploads
            media_libraries:
              all:
                max_file_size: 10485760

      - label: The page
        name: body
        widget: markdown
        required: true

# ─── Singletons ───────────────────────────────────────────────────────────────
#
# ⚠ A SECOND TOP-LEVEL LIST, AND THE END OF THIS FILE IS INSIDE IT.
#
# Everything above is a `collection` — a folder of entries an officer creates
# and deletes. Everything below is a `singleton` — one screen editing one file
# that always exists. The two are told apart by which list they are in and by
# one key: a singleton names a `file`, a collection names a `folder`.
#
# Adding a new folder collection by appending to the foot of this file puts it
# in the wrong list. The editor then reads it as a singleton, looks for the
# `file` it does not have, and stops with `Cannot read properties of undefined
# (reading 'match')` in the browser's console — which names neither this file
# nor the entry at fault. That happened on 5 September 2026 and cost an hour.
# A new folder collection goes ABOVE this line; a new single-file screen goes
# below it.
singletons:
  - name: banner
    label: Alert banner
    icon: campaign
    file: /content/banner/alert.md
    format: yaml-frontmatter
    fields:
      - label: Message
        name: title
        widget: string
        required: true
        hint: One line. A banner that runs to a paragraph stops being read.

      # The field stores a NAME, not a color. A color picker would let any
      # value be chosen, including ones that are unreadable against the text,
      # and it would put a presentation decision into the content where a later
      # redesign cannot reach it. A fixed set of names does the opposite: the
      # colors live in the stylesheet, so changing one changes every banner
      # that has ever carried that name, and the name itself comes to mean
      # something to a member who visits often.
      - label: What kind of notice is this?
        name: noticeKind
        widget: select
        default: notice
        required: true
        options:
          - { label: Notice, value: notice }
          - { label: Important, value: important }
          - { label: Cancelled, value: cancelled }
        hint: >-
          Sets the color of the banner, and the word at the front of it unless
          a different word is given below.

      # The word is content, not presentation: no word can be illegible against
      # its background, so nothing is gained by fixing it to the list above. The
      # color stays constrained; the wording does not.
      - label: A different word at the front
        name: noticeLabel
        widget: string
        required: false
        maxlength: 24
        hint: >-
          Leave this empty and the banner uses the usual word for the kind
          chosen above. Fill it in when that word is not the right one — a
          closure, a postponement, a change of place — and the color stays
          exactly the same.

      - label: Which announcement is this about?
        name: announcement
        widget: relation
        required: false
        collection: news
        value_field: 'news/{{slug}}'
        display_fields: [title]
        search_fields: [title]
        hint: >-
          Turns the banner into a link to that announcement. Choosing from the
          list means no address is typed, so none can later rot.

      - label: Show from
        name: publishDate
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss'
        input_timezone: America/New_York
        required: false

      - label: Stop showing after
        name: expiryDate
        widget: datetime
        type: date
        format: 'YYYY-MM-DD[T23:59:59]'
        input_timezone: America/New_York
        required: false
        hint: >-
          The banner has its own lifetime, separate from the announcement it
          points at. A banner about a meeting comes down after the meeting; the
          announcement of it stays as a record.

      - label: Take this down
        name: draft
        widget: boolean
        default: false
        required: false
        hint: Removes the banner at the next build.

  # ─── Calendar settings ──────────────────────────────────────────────────────
  # The four settings the calendar reads, in a screen an officer can reach.
  #
  # These were in `hugo.toml` until the calendar was built, where nobody but a
  # maintainer could change them: correcting the meeting time meant editing the
  # site's own configuration by hand. That is the thing this rebuild exists to
  # end, so they moved to `data/calendar.yml`, which Hugo reads as site data and
  # this screen writes.
  #
  # ⚠ The editor rewrites that file whole on every save, so it carries values
  # and no comments — anything explanatory written into it would be deleted the
  # first time somebody changed a setting. The reasoning is in `hugo.toml`,
  # beside the fall-back each setting has if this file loses a value.
  - name: calendar_settings
    label: Calendar settings
    icon: tune
    file: /data/calendar.yml
    format: yaml
    fields:
      - label: Which day of the month the Association meets
        name: meetingDay
        widget: string
        required: true
        hint: >-
          Written out, as it is read: third Thursday. This is the standing line
          shown at the top of every page and on the meetings page. It does not
          schedule anything — each meeting carries its own date.

      - label: What time the meeting starts
        name: meetingTime
        widget: string
        required: true
        hint: For example, 6:30 pm.

      - label: How many months the calendar shows
        name: monthsShown
        widget: number
        value_type: int
        min: 1
        max: 24
        default: 6
        required: true
        hint: >-
          Counting the current one. Six reaches from a September meeting to the
          following February.

      - label: How long an event lasts when no end time is given
        name: defaultMinutes
        widget: number
        value_type: int
        min: 15
        max: 600
        default: 90
        required: true
        hint: >-
          In minutes. Used only in the calendar subscription, where an entry
          with no length at all shows as an instant, as though the meeting took
          no time.

      - label: Show each venue's street address on the calendar
        name: showAddresses
        widget: boolean
        default: true
        required: false
        hint: >-
          The meetings page shows the name of the venue only. The calendar is
          the page built to carry the full details, and turning this off would
          leave the address reachable only by subscribing to the calendar.

      - label: The sentence under the calendar's heading
        name: lede
        widget: text
        required: true
        hint: Two or three lines. It is the first thing read on the page.
